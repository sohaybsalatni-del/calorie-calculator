<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حاسبة السعرات | Calorie Calculator</title><style>body{font-family:system-ui;max-width:900px;margin:0 auto;padding:20px;background:#f6f8f7;color:#111}header{background:#0f5132;color:#fff;padding:22px;border-radius:16px}h1{margin:0}input,select,button{padding:10px;border-radius:10px;border:1px solid #ccc;font-size:16px}button{background:#0f5132;color:#fff;border:none;cursor:pointer}.card{background:#fff;padding:18px;border-radius:16px;margin-top:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;text-align:right}.bar{height:10px;background:#eee;border-radius:20px;overflow:hidden}.bar>div{height:100%}</style></head><body>
<header><h1>🥗 حاسبة السعرات</h1><p>اكتب وجبتك بالعربي أو إنجليزي - مثال: صدر دجاج 200 غرام + رز 1 كوب</p></header>
<div class="card"><label>الوجبة:</label><br><input id="meal" style="width:100%;margin:10px 0" placeholder="مثال: 200g chicken breast + 1 cup rice"><br><button onclick="calc()">احسب السعرات</button> <button onclick="sample()">جرب وجبة جاهزة</button></div>
<div class="card"><h3>أضف مكون يدوياً</h3><select id="food"></select> <input id="qty" type="number" value="100" style="width:90px"> <select id="unit"><option value="g">غرام</option><option value="cup">كوب</option><option value="tbsp">ملعقة كبيرة</option><option value="piece">حبة</option></select> <button onclick="addManual()">إضافة</button><div id="list" style="margin-top:12px"></div></div>
<div class="card" id="result"><h2>النتيجة</h2><p>اكتب وجبة واضغط احسب</p></div>
<script>
const FOODS={"صدر دجاج":{en:"Chicken Breast",cal:165,p:31,c:0,f:3.6},"رز":{en:"Rice",cal:130,p:2.7,c:28,f:0.3},"بيض":{en:"Egg",cal:155,p:13,c:1.1,f:11},"شوفان":{en:"Oats",cal:389,p:16.9,c:66,f:6.9},"موز":{en:"Banana",cal:89,p:1.1,c:23,f:0.3},"تفاح":{en:"Apple",cal:52,p:0.3,c:14,f:0.2},"زيت زيتون":{en:"Olive Oil",cal:884,p:0,c:0,f:100},"خبز":{en:"Bread",cal:265,p:9,c:49,f:3.2},"حليب":{en:"Milk",cal:42,p:3.4,c:5,f:1},"لبن":{en:"Yogurt",cal:59,p:10,c:3.6,f:0.4},"عدس":{en:"Lentils",cal:116,p:9,c:20,f:0.4},"بطاطا":{en:"Potato",cal:77,p:2,c:17,f:0.1},"تونة":{en:"Tuna",cal:144,p:30,c:0,f:1},"جبنة":{en:"Cheese",cal:402,p:25,c:1.3,f:33},"chicken breast":{en:"Chicken Breast",cal:165,p:31,c:0,f:3.6},"rice":{en:"Rice",cal:130,p:2.7,c:28,f:0.3},"egg":{en:"Egg",cal:155,p:13,c:1.1,f:11},"oats":{en:"Oats",cal:389,p:16.9,c:66,f:6.9},"banana":{en:"Banana",cal:89,p:1.1,c:23,f:0.3}};
const CUP={"رز":185,"شوفان":80,"حليب":240,"rice":185,"oats":80,"milk":240};
let items=[];
const sel=document.getElementById('food'); Object.keys(FOODS).forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k+' - '+FOODS[k].en;sel.appendChild(o)});
function grams(name,qty,unit){if(unit==='g')return qty;if(unit==='cup')return qty*(CUP[name]||200);if(unit==='tbsp')return qty*15;if(unit==='piece')return qty*100;return qty;}
function addManual(){let n=sel.value,q=parseFloat(document.getElementById('qty').value)||0,u=document.getElementById('unit').value;items.push({name:n,g:grams(n,q,u)});render();}
function sample(){document.getElementById('meal').value='صدر دجاج 200 غرام + رز 1 كوب + زيت زيتون 1 ملعقة كبيرة';calc();}
function render(){document.getElementById('list').innerHTML=items.map((it,i)=>`<div>${it.name} - ${it.g} غرام <button onclick="items.splice(${i},1);render();calcFromItems()">حذف</button></div>`).join('');}
function calcFromItems(){let t={cal:0,p:0,c:0,f:0};let rows=items.map(it=>{let f=FOODS[it.name];let m=it.g/100;let r={name:it.name,cal:f.cal*m,p:f.p*m,c:f.c*m,f:f.f*m};t.cal+=r.cal;t.p+=r.p;t.c+=r.c;t.f+=r.f;return r;});show(t,rows);}
function calc(){let txt=document.getElementById('meal').value;items=[];let parts=txt.split('+');parts.forEach(part=>{let m=part.match(/(\d+(\.\d+)?)/);let qty=m?parseFloat(m[1]):100;let unit='g';if(part.includes('كوب')||part.includes('cup'))unit='cup';if(part.includes('ملعقة'))unit='tbsp';let name=Object.keys(FOODS).find(k=>part.includes(k));if(name)items.push({name,g:grams(name,qty,unit)});});render();calcFromItems();}
function show(t,rows){let html=`<h2>المجموع: ${t.cal.toFixed(0)} سعرة</h2><p>بروتين: ${t.p.toFixed(1)}غ | كربوهيدرات: ${t.c.toFixed(1)}غ | دهون: ${t.f.toFixed(1)}غ</p><table><tr><th>المكون</th><th>سعرات</th><th>بروتين</th><th>كربوهيدرات</th><th>دهون</th></tr>${rows.map(r=>`<tr><td>${r.name}</td><td>${r.cal.toFixed(0)}</td><td>${r.p.toFixed(1)}</td><td>${r.c.toFixed(1)}</td><td>${r.f.toFixed(1)}</td></tr>`).join('')}</table>`;document.getElementById('result').innerHTML=html;}
</script></body></html>
